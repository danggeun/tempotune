name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · boundaries · unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  build:
    name: build (pages + capacitor base)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cap
      - uses: actions/upload-artifact@v4
        with: { name: dist-capacitor, path: dist, retention-days: 7 }

  e2e:
    name: e2e (fake mic WAV)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist-capacitor, path: dist }
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: node scripts/e2e.mjs --dist dist

  screenshots:
    name: screenshot regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: |
          npx playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      # 기준선은 아직 CI 환경에서 찍은 것이 아니다. 첫 녹색 실행의 screenshot-diffs 아티팩트를 baseline/ 으로 커밋한 뒤 이 줄을 지운다.
      - id: shots
        continue-on-error: true
        run: npm run shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: test-assets/screens/current/*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.shots.outcome == 'failure'
        run: echo "::warning::스크린샷이 기준선과 다릅니다 — screenshot-diffs 아티팩트 확인"
